<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Avenli — Give it a problem. Get it solved.</title>
  <desc id="description">Avenli hackathon cover with the product mark, promise, workflow and technology stack.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfcff"/>
      <stop offset="0.58" stop-color="#f4f6ff"/>
      <stop offset="1" stop-color="#ece8ff"/>
